<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf5ef">
  <title>Guild HQ — The Cozy Florist</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
  <style>
    /* Guild HQ — mobile-first, cozy florist theme */
    * { box-sizing: border-box; }
    :root {
      --bg: #faf5ef; --card: #ffffff; --ink: #3d3230; --muted: #8a7a72; --line: #eee2d8;
      --accent: #c95f7d; --accent-soft: #f7e3ea; --leaf: #5f8a5e; --leaf-soft: #e5efe2;
      --gold: #c99a3a; --danger: #b8483f; --radius: 14px; --nav-h: 62px;
      --shadow: 0 1px 3px rgba(80, 50, 40, .08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #211c1a; --card: #2c2523; --ink: #f0e6df; --muted: #a99a90; --line: #3d3330;
        --accent: #e08aa4; --accent-soft: #43302f; --leaf: #8fb98d; --leaf-soft: #2e3a2c;
        --gold: #d9b060; --danger: #e07a70; --shadow: 0 1px 3px rgba(0, 0, 0, .3);
      }
    }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--ink);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #app { max-width: 860px; margin: 0 auto; padding: 0 14px calc(var(--nav-h) + 28px); }
    a { color: var(--accent); text-decoration: none; }
    h1 { font-size: 1.35rem; margin: 18px 0 4px; }
    h2 { font-size: 1.05rem; margin: 22px 0 8px; }
    h3 { font-size: .95rem; margin: 14px 0 6px; }
    p { margin: 6px 0; }
    .muted { color: var(--muted); font-size: .85rem; }
    .small { font-size: .8rem; }
    .topbar { display: flex; align-items: center; gap: 10px; padding: 14px 2px 4px; }
    .topbar .title { font-weight: 700; font-size: 1.1rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rolechip { font-size: .72rem; font-weight: 600; letter-spacing: .02em; padding: 3px 9px; border-radius: 99px; background: var(--leaf-soft); color: var(--leaf); }
    .rolechip.admin { background: var(--accent-soft); color: var(--accent); }
    nav.tabs {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
      display: flex; justify-content: space-around; background: var(--card); border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom); height: calc(var(--nav-h) + env(safe-area-inset-bottom));
    }
    nav.tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); font-size: .62rem; font-weight: 600; padding-top: 6px; }
    nav.tabs a .ico { font-size: 1.25rem; line-height: 1; }
    nav.tabs a.active { color: var(--accent); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin: 10px 0; box-shadow: var(--shadow); }
    .cardgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (min-width: 640px) { .cardgrid { grid-template-columns: repeat(4, 1fr); } }
    .stat { text-align: left; }
    .stat .num { font-size: 1.55rem; font-weight: 750; letter-spacing: -.02em; }
    .stat .lbl { color: var(--muted); font-size: .74rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
    .stat .sub { color: var(--muted); font-size: .78rem; }
    .badge { display: inline-block; font-size: .68rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; vertical-align: middle; background: var(--gold); color: #fff; }
    .chip { display: inline-flex; align-items: center; gap: 5px; background: var(--leaf-soft); color: var(--leaf); border-radius: 99px; padding: 3px 10px; font-size: .78rem; font-weight: 600; margin: 2px 4px 2px 0; }
    .chip.rose { background: var(--accent-soft); color: var(--accent); }
    .chip button { all: unset; cursor: pointer; font-weight: 800; padding: 0 2px; }
    .flowerlist { display: grid; gap: 5px; align-items: start; min-width: 240px; }
    .flowerpill { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 99px; padding: 3px 9px; background: var(--bg); font-size: .78rem; white-space: nowrap; }
    .flowerpill strong { font-variant-numeric: tabular-nums; }
    /* colour-coded labels: member roles, flower rarities, florist ranks */
    .tag { display: inline-flex; align-items: center; gap: 4px; border-radius: 99px; padding: 2px 9px; font-size: .72rem; font-weight: 700; letter-spacing: .01em; white-space: nowrap; vertical-align: middle; }
    .tag-red      { background: #fbe3e0; color: #ad3a31; }
    .tag-yellow   { background: #f8edcd; color: #92701a; }
    .tag-purple   { background: #eee3f8; color: #7d4bb0; }
    .tag-blue     { background: #ddecf9; color: #2b6fa8; }
    .tag-green    { background: #e2efdf; color: #47753f; }
    .tag-electric { background: linear-gradient(100deg, #4d64f5, #9b3ff0); color: #fff; }
    .tag-none     { background: var(--line); color: var(--muted); }
    @media (prefers-color-scheme: dark) {
      .tag-red      { background: #4a2b28; color: #f0968d; }
      .tag-yellow   { background: #453a20; color: #e5c069; }
      .tag-purple   { background: #3c2d4a; color: #c9a1f0; }
      .tag-blue     { background: #26394b; color: #85c0ea; }
      .tag-green    { background: #2c3a29; color: #9ecc95; }
      .tag-electric { background: linear-gradient(100deg, #5a6cff, #a24bff); color: #fff; }
    }
    /* rivals estimate cards */
    .rivalcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin: 10px 0; }
    .estcard { margin: 0; }
    .estcard .estname { margin: 0 0 8px; font-size: 1rem; }
    .estcard .estname[data-editrival] { cursor: pointer; color: var(--accent); }
    .estrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 4px 0; }
    .estrow input { width: 84px; flex: 0 0 auto; margin: 0; padding: 6px 8px; text-align: right; }
    .estrow strong { font-variant-numeric: tabular-nums; }
    .estscores { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; text-align: center; }
    .estscores span { display: block; }
    .estscores strong { font-size: 1.05rem; font-variant-numeric: tabular-nums; }
    .tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 8px -14px; padding: 0 14px; }
    table { border-collapse: collapse; width: 100%; font-size: .86rem; min-width: 480px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    td.wrap { white-space: normal; }
    th { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); user-select: none; position: sticky; top: 0; background: var(--card); }
    th.sortable { cursor: pointer; }
    th.sortable::after { content: ' ↕'; opacity: .4; }
    th.sorted-asc::after { content: ' ↑'; opacity: 1; color: var(--accent); }
    th.sorted-desc::after { content: ' ↓'; opacity: 1; color: var(--accent); }
    tr.rowlink { cursor: pointer; }
    tr.rowlink:active { background: var(--accent-soft); }
    tr.highlight td { background: var(--accent-soft); font-weight: 700; }
    input, select, textarea, button { font: inherit; color: inherit; }
    input, select, textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); margin: 2px 0 10px; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
    label { font-size: .78rem; font-weight: 700; color: var(--muted); display: block; }
    label.inline { display: flex; align-items: center; gap: 8px; font-size: .88rem; color: var(--ink); }
    input[type="checkbox"] { width: auto; margin: 0; accent-color: var(--accent); }
    textarea { min-height: 84px; resize: vertical; }
    .formrow { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
    .formrow3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 10px; }
    button.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: none; border-radius: 10px; padding: 10px 16px; background: var(--accent); color: #fff; font-weight: 700; font-size: .9rem; cursor: pointer; margin: 2px 6px 2px 0; }
    button.btn:active { transform: scale(.98); }
    button.btn.secondary { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
    button.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
    button.btn.small { padding: 6px 11px; font-size: .8rem; border-radius: 8px; }
    button.btn:disabled { opacity: .5; cursor: default; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
    .toolbar input, .toolbar select { width: auto; flex: 1; min-width: 120px; margin: 0; }
    .toolbar select { flex: 0 1 auto; }
    dialog { border: none; border-radius: var(--radius); background: var(--card); color: var(--ink); width: min(480px, calc(100vw - 32px)); max-height: 86dvh; overflow-y: auto; padding: 18px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
    dialog::backdrop { background: rgba(40, 25, 20, .45); }
    dialog h2 { margin-top: 0; }
    .bar { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: .82rem; }
    .bar .name { flex: 0 0 108px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar .track { flex: 1; background: var(--line); border-radius: 99px; height: 14px; overflow: hidden; }
    .bar .fill { height: 100%; background: var(--muted); border-radius: 99px; min-width: 2px; }
    .bar.ours .fill { background: var(--accent); }
    .bar.ours .name { font-weight: 800; color: var(--accent); }
    .bar .place { flex: 0 0 38px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
    .bar .val { flex: 0 0 56px; text-align: right; font-variant-numeric: tabular-nums; }
    #toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 18px); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-size: .85rem; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; max-width: 90vw; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.error { background: var(--danger); color: #fff; }
    .empty { text-align: center; color: var(--muted); padding: 26px 10px; }
    .empty .big { font-size: 2rem; }
    details.quests { margin: 4px 0; }
    details.quests summary { cursor: pointer; color: var(--accent); font-size: .8rem; font-weight: 700; }
    .questrow { display: grid; grid-template-columns: 1fr auto 64px 70px auto; gap: 6px; align-items: center; margin: 4px 0; }
    .questrow select, .questrow input { margin: 0; padding: 6px 8px; }
    .backlink { display: inline-block; margin-top: 14px; font-weight: 700; font-size: .85rem; }
    hr { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
  </style>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script>
/* Guild HQ — The Cozy Florist guild tracker (standalone, offline, localStorage). */
'use strict';

const STORAGE_KEY = 'cozy-guild-hq-v1';
const MODE_KEY = 'cozy-guild-hq-mode';

// ------------------------------------------------------------------ state --

const state = { mode: localStorage.getItem(MODE_KEY) === 'viewer' ? 'viewer' : 'admin', data: null };

const ui = {
  sort: {
    summary: { key: 'name', dir: 1 },
    members: { key: 'name', dir: 1 },
    memberFlowers: { key: 'rarity', dir: -1 },
    flowers: { key: 'points', dir: -1 },
    rivals: { key: 'score', dir: -1 },
    weekCompetitors: { key: 'placement', dir: 1 },
  },
  search: { summary: '', members: '', flowers: '', rivals: '' },
  filters: { summaryFlower: '', membersRole: '', showInactive: false, flowersRarity: '' },
  weekDraft: { compId: null, results: {} },
  rivalsWeekId: null, // which competition week the Rivals estimate cards show
  rivalsShowAll: false,
};

const $ = sel => document.querySelector(sel);
const app = () => $('#app');
const isAdmin = () => state.mode === 'admin';

// -------------------------------------------------------------- store/db --

function defaultData() {
  return {
    settings: {
      guildName: 'My Guild',
      memberCapacity: 40,
      questsMin: 18,
      questsMax: 24,
      baseQuestScores: [21, 23, 25, 28, 30],
      maxMultiplier: 2,
      bonusMin: 1,
      bonusMax: 4,
      potential: {
        scorePerQuest: 60,   // top base (30) × max multiplier (2)
        includeBonus: true,
        avgBonus: 2.5,       // midpoint of bonus range
        membersOverride: null,
      },
      floristRanks: {
        // Min points behind each profile label — drives the Rivals calculator.
        // "honored" is a guess (reported as "100+", assumed typo for 1000).
        standard: 500,
        senior: 700,
        honored: 1000,
        peerless: 1300,
        supreme: 1400,
        unknown: 500,        // assumed floor for members showing no label
      },
    },
    members: [],
    flowers: [],
    competitions: [],
  };
}

function normalize(d) {
  if (!d || typeof d !== 'object') d = defaultData();
  const def = defaultData();
  d.settings = { ...def.settings, ...(d.settings || {}) };
  d.settings.potential = { ...def.settings.potential, ...((d.settings && d.settings.potential) || {}) };
  d.settings.floristRanks = { ...def.settings.floristRanks, ...(d.settings.floristRanks || {}) };
  for (const k of ['members', 'flowers', 'competitions']) {
    if (!Array.isArray(d[k])) d[k] = [];
  }
  for (const m of d.members) {
    if (!m.flowerBonuses || typeof m.flowerBonuses !== 'object') m.flowerBonuses = {};
  }
  for (const f of d.flowers) {
    if (!('rarity' in f)) f.rarity = null;
    delete f.categoryId; // categories were superseded by rarity
  }
  delete d.categories;
  return d;
}

function load() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { /* corrupt/empty */ }
  state.data = normalize(raw);
}

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
    return true;
  } catch (e) {
    toast('Could not save — storage full or blocked. ' + (e.message || ''), true);
    return false;
  }
}

// commit: run a mutation, persist, re-render, toast. Returns success boolean.
function commit(fn, successMsg) {
  try {
    fn();
  } catch (e) {
    toast(e.message || 'Something went wrong.', true);
    return false;
  }
  persist();
  render();
  if (successMsg) toast(successMsg);
  return true;
}

// ---------------------------------------------------------------- helpers --

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[c]);
}
const fmtNum = n => (n === null || n === undefined || n === '' ? '—' : Number(n).toLocaleString());
function ordinal(n) {
  if (n === null || n === undefined || n === '') return '—';
  n = Number(n);
  const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
function localISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function fmtDate(iso) {
  if (!iso) return '—';
  const [y, m, d] = iso.split('-').map(Number);
  if (!y || !m || !d) return iso;
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
}
function weekLabel(c) {
  if (!c.weekStart) return 'Unscheduled week';
  if (!c.weekEnd) return fmtDate(c.weekStart);
  const [y1, m1, d1] = c.weekStart.split('-').map(Number);
  const [y2, m2, d2] = c.weekEnd.split('-').map(Number);
  const a = new Date(y1, m1 - 1, d1), b = new Date(y2, m2 - 1, d2);
  const sameMonth = y1 === y2 && m1 === m2;
  const left = a.toLocaleDateString(undefined, sameMonth ? { day: 'numeric' } : { day: 'numeric', month: 'short' });
  const right = b.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  return `${left}–${right}`;
}
function mostRecentTuesday() {
  const d = new Date();
  d.setDate(d.getDate() - ((d.getDay() - 2 + 7) % 7));
  return d;
}
function flowerById(id) { return state.data.flowers.find(f => f.id === id); }
function memberById(id) { return state.data.members.find(m => m.id === id); }
function flowerOwners(flowerId) {
  return state.data.members.filter(m => (m.flowerIds || []).includes(flowerId));
}
function firstFlowerOwnerName(flowerId) {
  const owners = flowerOwners(flowerId).map(m => m.name).sort((a, b) => cmp(a, b));
  return owners[0] || null;
}
function ownedFlowerIds() {
  return new Set(state.data.members.flatMap(m => m.flowerIds || []));
}

function uuid() {
  try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch { /* fall through */ }
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const s = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return `${s.slice(0, 8)}-${s.slice(8, 12)}-${s.slice(12, 16)}-${s.slice(16, 20)}-${s.slice(20)}`;
}
const isNum = v => typeof v === 'number' && Number.isFinite(v);
const optNum = v => (v === null || v === undefined || v === '' ? null : (isNum(Number(v)) ? Number(v) : null));
const str = (v, max = 500) => String(v ?? '').slice(0, max);
const ROLES = ['Leader', 'Co-Leader', 'Elder', 'Elite', 'Member'];

// colour-coded labels ---------------------------------------------------------

const ROLE_COLORS = { Leader: 'red', 'Co-Leader': 'yellow', Elder: 'purple', Elite: 'blue', Member: 'green' };
const roleTag = role => `<span class="tag tag-${ROLE_COLORS[role] || 'green'}">${esc(role)}</span>`;

const RARITIES = [
  { key: 'UR', label: 'Ultra Rare', color: 'red' },
  { key: 'SSR', label: 'Super Special Rare', color: 'yellow' },
  { key: 'SR', label: 'Super Rare', color: 'purple' },
  { key: 'R', label: 'Rare', color: 'blue' },
  { key: 'N', label: 'Normal', color: 'green' },
];
const RARITY_KEYS = RARITIES.map(r => r.key);
function rarityRank(key) { // UR highest, no rarity lowest
  const i = RARITIES.findIndex(r => r.key === key);
  return i === -1 ? 0 : RARITIES.length - i;
}
function rarityTag(key) {
  const r = RARITIES.find(x => x.key === key);
  return r ? `<span class="tag tag-${r.color}" title="${r.label}">${r.key}</span>` : '<span class="muted">—</span>';
}

const FLORIST_RANKS = [
  { key: 'standard', label: 'Standard Florist', color: 'blue' },
  { key: 'senior', label: 'Senior Florist', color: 'purple' },
  { key: 'honored', label: 'Honored Florist', color: 'yellow' },
  { key: 'peerless', label: 'Peerless Florist', color: 'red' },
  { key: 'supreme', label: 'Supreme Florist', color: 'electric' },
];

const flowerBonus = (m, flowerId) => (m.flowerBonuses || {})[flowerId] || 0;

// ------------------------------------------------- validation / mutations --

function sanitizeMemberPatch(body, existing) {
  const m = { ...existing };
  if ('name' in body) m.name = str(body.name, 80);
  if ('role' in body) m.role = ROLES.includes(body.role) ? body.role : 'Member';
  if ('timezone' in body) m.timezone = str(body.timezone, 60);
  if ('active' in body) m.active = Boolean(body.active);
  if ('notes' in body) m.notes = str(body.notes, 4000);
  if ('questCount' in body) {
    const n = optNum(body.questCount);
    m.questCount = n === null ? existing.questCount : Math.max(0, Math.min(99, Math.round(n)));
  }
  if ('potentialOverride' in body) m.potentialOverride = optNum(body.potentialOverride);
  if ('flowerIds' in body && Array.isArray(body.flowerIds)) {
    const valid = new Set(state.data.flowers.map(f => f.id));
    m.flowerIds = [...new Set(body.flowerIds.filter(id => valid.has(id)))];
  }
  if ('flowerBonuses' in body && body.flowerBonuses && typeof body.flowerBonuses === 'object') {
    const valid = new Set(state.data.flowers.map(f => f.id));
    const bonuses = {};
    for (const [fid, v] of Object.entries(body.flowerBonuses)) {
      const n = optNum(v);
      if (valid.has(fid) && n !== null && n > 0) bonuses[fid] = Math.min(99999, Math.round(n));
    }
    m.flowerBonuses = bonuses;
  }
  if (m.flowerBonuses) {
    // a bonus only makes sense on a flower the member still owns
    const owned = new Set(m.flowerIds || []);
    for (const fid of Object.keys(m.flowerBonuses)) {
      if (!owned.has(fid)) delete m.flowerBonuses[fid];
    }
  }
  return m;
}

const EST_KEYS = ['standard', 'senior', 'honored', 'peerless', 'supreme'];

// rival title-count estimate: {totalPlayers, counts:{standard..supreme}} or null
function sanitizeEstimate(e) {
  if (!e || typeof e !== 'object') return null;
  const counts = {};
  for (const k of EST_KEYS) {
    const n = optNum(e.counts && e.counts[k]);
    counts[k] = n === null ? 0 : Math.max(0, Math.min(99, Math.round(n)));
  }
  const totalPlayers = optNum(e.totalPlayers);
  const hasData = totalPlayers !== null || EST_KEYS.some(k => counts[k] > 0);
  return hasData ? { totalPlayers, counts } : null;
}

function sanitizeCompetitionPatch(body, existing) {
  const c = { ...existing };
  if ('weekStart' in body) c.weekStart = str(body.weekStart, 10);
  if ('weekEnd' in body) c.weekEnd = str(body.weekEnd, 10);
  if ('ourScore' in body) c.ourScore = optNum(body.ourScore);
  if ('ourRankTitle' in body) c.ourRankTitle = str(body.ourRankTitle, 60);
  if ('ourPlacement' in body) c.ourPlacement = optNum(body.ourPlacement);
  if ('notes' in body) c.notes = str(body.notes, 4000);
  if ('competitors' in body && Array.isArray(body.competitors)) {
    c.competitors = body.competitors.slice(0, 50).map(r => ({
      id: typeof r.id === 'string' && r.id ? r.id : uuid(),
      name: str(r.name, 80), score: optNum(r.score),
      rankTitle: str(r.rankTitle, 60), placement: optNum(r.placement),
      notes: str(r.notes, 2000),
      estimate: sanitizeEstimate(r.estimate),
    })).filter(r => r.name);
  }
  if ('memberResults' in body && Array.isArray(body.memberResults)) {
    const memberIds = new Set(state.data.members.map(m => m.id));
    c.memberResults = body.memberResults.slice(0, 400)
      .filter(r => memberIds.has(r.memberId))
      .map(r => ({
        memberId: r.memberId,
        finalScore: optNum(r.finalScore),
        questsCompleted: optNum(r.questsCompleted),
        questDetail: Array.isArray(r.questDetail)
          ? r.questDetail.slice(0, 40).map(q => ({ base: optNum(q.base) ?? 0, maxed: Boolean(q.maxed), bonus: optNum(q.bonus) ?? 0 }))
          : [],
      }));
  }
  return c;
}

const store = {
  addMember(body) {
    const m = sanitizeMemberPatch(body, {
      id: uuid(), name: '', role: 'Member', timezone: '', active: true,
      notes: '', questCount: state.data.settings.questsMin, flowerIds: [], flowerBonuses: {}, potentialOverride: null,
    });
    if (!m.name) throw new Error('Name is required.');
    state.data.members.push(m);
    return m;
  },
  updateMember(id, body) {
    const m = memberById(id);
    if (!m) throw new Error('Member not found.');
    const updated = sanitizeMemberPatch(body, m);
    if (!updated.name) throw new Error('Name is required.');
    Object.assign(m, updated);
    return m;
  },
  deleteMember(id) {
    state.data.members = state.data.members.filter(m => m.id !== id);
    for (const c of state.data.competitions) {
      c.memberResults = (c.memberResults || []).filter(r => r.memberId !== id);
    }
  },
  addFlower(body) {
    const name = str(body.name, 80);
    if (!name) throw new Error('Name is required.');
    const flower = {
      id: uuid(), name,
      rarity: RARITY_KEYS.includes(body.rarity) ? body.rarity : null,
      points: optNum(body.points) ?? 0,
    };
    state.data.flowers.push(flower);
    return flower;
  },
  updateFlower(id, body) {
    const flower = flowerById(id);
    if (!flower) throw new Error('Flower not found.');
    if ('name' in body) {
      const name = str(body.name, 80);
      if (!name) throw new Error('Name is required.');
      flower.name = name;
    }
    if ('rarity' in body) flower.rarity = RARITY_KEYS.includes(body.rarity) ? body.rarity : null;
    if ('points' in body) flower.points = optNum(body.points) ?? flower.points;
    return flower;
  },
  deleteFlower(id) {
    state.data.flowers = state.data.flowers.filter(f => f.id !== id);
    for (const m of state.data.members) {
      m.flowerIds = (m.flowerIds || []).filter(fid => fid !== id);
      if (m.flowerBonuses) delete m.flowerBonuses[id];
    }
  },
  addCompetition(body) {
    const c = sanitizeCompetitionPatch(body, {
      id: uuid(), weekStart: '', weekEnd: '', ourScore: null, ourRankTitle: '',
      ourPlacement: null, notes: '', memberResults: [], competitors: [],
    });
    if (!c.weekStart) throw new Error('Week start date is required.');
    state.data.competitions.push(c);
    return c;
  },
  updateCompetition(id, body) {
    const comp = state.data.competitions.find(c => c.id === id);
    if (!comp) throw new Error('Competition not found.');
    Object.assign(comp, sanitizeCompetitionPatch(body, comp));
    return comp;
  },
  deleteCompetition(id) {
    state.data.competitions = state.data.competitions.filter(c => c.id !== id);
  },
  updateSettings(body) {
    const s = state.data.settings;
    if ('guildName' in body) s.guildName = str(body.guildName, 80) || 'My Guild';
    if ('memberCapacity' in body) s.memberCapacity = Math.max(1, Math.min(999, optNum(body.memberCapacity) ?? s.memberCapacity));
    if ('questsMin' in body) s.questsMin = Math.max(0, Math.min(99, optNum(body.questsMin) ?? s.questsMin));
    if ('questsMax' in body) s.questsMax = Math.max(s.questsMin, Math.min(99, optNum(body.questsMax) ?? s.questsMax));
    if ('baseQuestScores' in body && Array.isArray(body.baseQuestScores)) {
      const scores = body.baseQuestScores.map(optNum).filter(n => n !== null && n > 0).slice(0, 20);
      if (scores.length) s.baseQuestScores = [...new Set(scores)].sort((a, b) => a - b);
    }
    if ('maxMultiplier' in body) s.maxMultiplier = Math.max(1, optNum(body.maxMultiplier) ?? s.maxMultiplier);
    if ('bonusMin' in body) s.bonusMin = Math.max(0, optNum(body.bonusMin) ?? s.bonusMin);
    if ('bonusMax' in body) s.bonusMax = Math.max(s.bonusMin, optNum(body.bonusMax) ?? s.bonusMax);
    if (body.potential && typeof body.potential === 'object') {
      const p = body.potential;
      if ('scorePerQuest' in p) s.potential.scorePerQuest = Math.max(0, optNum(p.scorePerQuest) ?? s.potential.scorePerQuest);
      if ('includeBonus' in p) s.potential.includeBonus = Boolean(p.includeBonus);
      if ('avgBonus' in p) s.potential.avgBonus = Math.max(0, optNum(p.avgBonus) ?? s.potential.avgBonus);
      if ('membersOverride' in p) s.potential.membersOverride = optNum(p.membersOverride);
    }
    if (body.floristRanks && typeof body.floristRanks === 'object') {
      for (const key of Object.keys(s.floristRanks)) {
        if (key in body.floristRanks) {
          const n = optNum(body.floristRanks[key]);
          if (n !== null) s.floristRanks[key] = Math.max(0, n);
        }
      }
    }
  },
  replaceAll(imported) {
    state.data = normalize(imported);
  },
};

// -------------------------------------------------- potential estimate ----

function effScorePerQuest() {
  const p = state.data.settings.potential;
  return (p.scorePerQuest || 0) + (p.includeBonus ? (p.avgBonus || 0) : 0);
}
function bestPotentialFlower(m) {
  const s = state.data.settings;
  return (m.flowerIds || [])
    .map(flowerById)
    .filter(Boolean)
    .map(f => ({
      flower: f,
      bonus: flowerBonus(m, f.id),
      scorePerQuest: (f.points || 0) * s.maxMultiplier + flowerBonus(m, f.id),
    }))
    .sort((a, b) => cmp(b.flower.points || 0, a.flower.points || 0) || cmp(b.bonus, a.bonus) || cmp(a.flower.name, b.flower.name))[0] || null;
}
function memberPotential(m) {
  if (m.potentialOverride !== null && m.potentialOverride !== undefined) return m.potentialOverride;
  const best = bestPotentialFlower(m);
  if (!best) return 0;
  return Math.round(state.data.settings.questsMax * best.scorePerQuest);
}
function guildPotential() {
  const active = state.data.members.filter(m => m.active);
  return {
    value: active.reduce((sum, m) => sum + memberPotential(m), 0),
    basis: active.length
      ? `sum over ${active.length} active members (each: ${state.data.settings.questsMax} quests × their highest owned flower after multiplier and bonus)`
      : 'no active members with flower data yet',
  };
}

let toastTimer = null;
function toast(msg, isError = false) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'show' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 2600);
}
function openDialog(html) {
  document.querySelectorAll('dialog').forEach(d => d.remove());
  const dlg = document.createElement('dialog');
  dlg.innerHTML = html;
  document.body.appendChild(dlg);
  dlg.addEventListener('close', () => dlg.remove());
  dlg.showModal();
  return dlg;
}
function sortArrow(view, key) {
  const s = ui.sort[view];
  if (s.key !== key) return 'sortable';
  return 'sortable ' + (s.dir === 1 ? 'sorted-asc' : 'sorted-desc');
}
function bindSortHeaders(view, rerender) {
  document.querySelectorAll(`[data-sortview="${view}"] th[data-key]`).forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key, s = ui.sort[view];
      if (s.key === key) {
        s.dir = view === 'weekCompetitors' && key === 'placement' ? 1 : -s.dir;
      } else {
        s.key = key;
        s.dir = (key === 'score' || key === 'potential' || key === 'flowers' || key === 'topFlower' || key === 'date') ? -1 : 1;
      }
      rerender();
    });
  });
}
function cmp(a, b) {
  if (a === null || a === undefined || a === '') return 1;
  if (b === null || b === undefined || b === '') return -1;
  if (typeof a === 'number' && typeof b === 'number') return a - b;
  return String(a).localeCompare(String(b), undefined, { sensitivity: 'base', numeric: true });
}
function downloadFile(filename, text, type = 'text/csv') {
  const blob = new Blob([text], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}
function csvCell(v) {
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function topMemberFlowers(m, limit = 5) {
  return (m.flowerIds || [])
    .map(flowerById)
    .filter(Boolean)
    .map(f => ({ flower: f, bonus: flowerBonus(m, f.id), total: (f.points || 0) + flowerBonus(m, f.id) }))
    .sort((a, b) => cmp(b.total, a.total) || cmp(b.flower.points || 0, a.flower.points || 0) || cmp(a.flower.name, b.flower.name))
    .slice(0, limit);
}

function floristRankForPoints(points) {
  let best = null;
  for (const rank of FLORIST_RANKS) {
    if (points >= (state.data.settings.floristRanks[rank.key] || 0)) best = rank;
  }
  return best;
}
function floristRankTag(points) {
  const rank = floristRankForPoints(points);
  return rank
    ? `<span class="tag tag-${rank.color}">${rank.label}</span>`
    : '<span class="tag tag-none">Below Standard Florist</span>';
}
function summaryRows() {
  const q = ui.search.summary.toLowerCase().trim();
  const flowerFilter = ui.filters.summaryFlower;
  const rows = state.data.members.filter(m => {
    const top = topMemberFlowers(m);
    const allFlowers = (m.flowerIds || []).map(flowerById).filter(Boolean);
    const haystack = [
      m.name,
      m.role,
      m.timezone,
      m.notes,
      ...allFlowers.map(f => f.name),
      floristRankForPoints(memberPotential(m))?.label || '',
    ].join(' ').toLowerCase();
    return (!flowerFilter || (m.flowerIds || []).includes(flowerFilter)) &&
      (!q || haystack.includes(q)) &&
      (top.length || !flowerFilter);
  });
  const { key, dir } = ui.sort.summary;
  const val = m => ({
    name: m.name,
    role: ROLES.indexOf(m.role),
    potential: memberPotential(m),
    flowers: (m.flowerIds || []).length,
    timezone: m.timezone || null,
    topFlower: topMemberFlowers(m)[0]?.total ?? null,
  })[key];
  return rows.sort((a, b) => dir * cmp(val(a), val(b)) || cmp(a.name, b.name));
}

function weeklyPlacementMap(c, ourScore) {
  const entries = [
    { id: 'ours', score: ourScore },
    ...(c.competitors || []).map(r => ({ id: r.id, score: r.score })),
  ]
    .filter(r => r.score !== null && r.score !== undefined)
    .sort((a, b) => cmp(b.score, a.score));
  const placements = new Map();
  let lastScore = null, place = 0;
  entries.forEach((entry, index) => {
    if (lastScore === null || Number(entry.score) !== Number(lastScore)) place = index + 1;
    placements.set(entry.id, place);
    lastScore = entry.score;
  });
  return placements;
}
function autoPlacementPatch(c, competitors, ourScore) {
  const placements = weeklyPlacementMap({ ...c, competitors }, ourScore);
  const patch = {
    competitors: competitors.map(r => ({ ...r, placement: placements.get(r.id) ?? r.placement })),
  };
  const ourPlacement = placements.get('ours');
  if (ourPlacement !== undefined) patch.ourPlacement = ourPlacement;
  return patch;
}

function sortWeekCompetitorRows(rows, placements = new Map()) {
  const { key, dir } = ui.sort.weekCompetitors;
  const val = r => ({ name: r.name, score: r.score, rankTitle: r.rankTitle, placement: placements.get(r.id) ?? r.placement })[key];
  return rows.sort((a, b) =>
    dir * cmp(val(a), val(b)) ||
    (key === 'placement' ? cmp(b.score, a.score) : cmp(a.placement, b.placement)) ||
    cmp(a.name, b.name));
}

function ensureWeekDraft(c) {
  if (ui.weekDraft.compId === c.id) return;
  const results = {};
  for (const r of c.memberResults || []) {
    results[r.memberId] = { finalScore: r.finalScore, questsCompleted: r.questsCompleted, questDetail: (r.questDetail || []).map(q => ({ ...q })) };
  }
  ui.weekDraft = { compId: c.id, results };
}
function draftFor(memberId) {
  if (!ui.weekDraft.results[memberId]) ui.weekDraft.results[memberId] = { finalScore: null, questsCompleted: null, questDetail: [] };
  return ui.weekDraft.results[memberId];
}
function hasMemberResultData(r) {
  return r && (r.finalScore != null || r.questsCompleted != null || (r.questDetail || []).length);
}
function mergedMemberResultsForSave(c) {
  const merged = new Map((c.memberResults || []).map(r => [r.memberId, {
    memberId: r.memberId,
    finalScore: r.finalScore,
    questsCompleted: r.questsCompleted,
    questDetail: (r.questDetail || []).map(q => ({ ...q })),
  }]));
  for (const [memberId, draft] of Object.entries(ui.weekDraft.results)) {
    if (hasMemberResultData(draft)) {
      merged.set(memberId, { memberId, ...draft, questDetail: (draft.questDetail || []).map(q => ({ ...q })) });
    } else {
      merged.delete(memberId);
    }
  }
  return [...merged.values()];
}
function memberResultsScoreSummary(memberResults) {
  const scores = memberResults.map(r => r.finalScore).filter(v => v !== null && v !== undefined);
  return { hasScores: scores.length > 0, total: scores.reduce((sum, score) => sum + Number(score || 0), 0) };
}
function currentWeekOurScore(c) {
  const score = memberResultsScoreSummary(mergedMemberResultsForSave(c));
  return score.hasScores ? score.total : c.ourScore;
}
function refreshWeekScoreTotal(c) {
  const score = currentWeekOurScore(c);
  document.querySelectorAll('[data-week-our-score]').forEach(el => { el.textContent = fmtNum(score); });
}

  app().innerHTML = chrome(`

      ${c.notes ? `<p class="muted" style="white-space:pre-wrap">${esc(c.notes)}</p>` : ''}
      ${isAdmin() ? `<button class="btn small" id="editweek">Edit</button>

          <span class="val">${fmtNum(e.score)}</span>
        </div>`).join('')}
    </div>` : ''}

function questDetailDialog(c, memberId, editable) {
  const m = memberById(memberId);

  const rows = () => dr.questDetail || (dr.questDetail = []);
  const questScore = q => Math.round(q.base * (q.maxed ? s.maxMultiplier : 1) + (q.bonus || 0));
  const total = () => rows().reduce((n, q) => n + questScore(q), 0);

  function body() {
    return `
      <h2>Quests — ${esc(m ? m.name : 'member')}</h2>
      <p class="muted small">Base scores come from Settings. Maxed = ×${s.maxMultiplier}. Bonus ${s.bonusMin}–${s.bonusMax}.</p>

          <div class="questrow">
            ${editable ? `
              <select data-qbase="${i}">
                ${s.baseQuestScores.map(b => `<option value="${b}" ${q.base === b ? 'selected' : ''}>${b}</option>`).join('')}
              </select>
              <label class="inline"><input type="checkbox" data-qmax="${i}" ${q.maxed ? 'checked' : ''}>max</label>
              <input type="number" data-qbonus="${i}" min="0" max="${s.bonusMax}" value="${q.bonus || 0}" title="bonus">
              <strong style="text-align:right">${questScore(q)}</strong>

              : `
              <span>Base ${q.base}</span><span>${q.maxed ? 'maxed' : ''}</span>
              <span>+${q.bonus || 0}</span><strong style="text-align:right">${questScore(q)}</strong><span></span>`}
          </div>`).join('') || '<p class="muted">No quests logged.</p>'}
      </div>
      <p><strong>Total: ${total()}</strong> · ${rows().length} quests</p>
      ${editable ? `<button class="btn secondary small" id="qadd">+ Quest</button>
        <button class="btn small" id="qapply">Use total as score & count</button><hr>` : ''}
      <button class="btn secondary" data-close>${editable ? 'Done' : 'Close'}</button>`;
  }
  const dlg = openDialog(body());
  function bind() {
    dlg.querySelector('[data-close]').addEventListener('click', () => { dlg.close(); if (editable) renderWeekDetail(c.id); });
    if (!editable) return;
    dlg.querySelector('#qadd').addEventListener('click', () => { rows().push({ base: s.baseQuestScores[s.baseQuestScores.length - 1] || 0, maxed: false, bonus: 0 }); rerender(); });
    dlg.querySelector('#qapply').addEventListener('click', () => {
      dr.finalScore = total(); dr.questsCompleted = rows().length;
      toast(`Set score ${dr.finalScore}, ${dr.questsCompleted} quests — remember to Save results`);
      dlg.close(); renderWeekDetail(c.id);
    });
    dlg.querySelectorAll('[data-qbase]').forEach(el => el.addEventListener('change', () => { rows()[el.dataset.qbase].base = Number(el.value); rerender(); }));
    dlg.querySelectorAll('[data-qmax]').forEach(el => el.addEventListener('change', () => { rows()[el.dataset.qmax].maxed = el.checked; rerender(); }));
    dlg.querySelectorAll('[data-qbonus]').forEach(el => el.addEventListener('input', () => { rows()[el.dataset.qbonus].bonus = Number(el.value) || 0; rerender(); }));
    dlg.querySelectorAll('[data-qdel]').forEach(el => el.addEventListener('click', () => { rows().splice(Number(el.dataset.qdel), 1); rerender(); }));
  }
  function rerender() { dlg.innerHTML = body(); bind(); }
  bind();
}

  for (const c of state.data.competitions) {
    for (const r of c.competitors || []) out.push({ comp: c, r, date: c.weekStart || '' });

  return out;

  const counts = [...FLORIST_RANKS].reverse()
    .map(rank => ({ rank, count: (est.counts || {})[rank.key] || 0 }))

// Estimate cards: one per rival guild in a competition week. Count the florist
// titles their members display in-game; each title means "earned ≥ that many
// points", so min = title floors, max = each member up to the NEXT title's
// floor (top title capped at our per-member max-potential estimate). Untitled
// members count at the assumed value from Settings in both. Saved on the
// week's rival record, so the actual score at week's end shows the error.

function maxPerMemberEst() {
  const s = state.data.settings;
  return Math.round(s.questsMax * effScorePerQuest());
}

function rankBounds(key) {
  const fr = state.data.settings.floristRanks;
  const i = FLORIST_RANKS.findIndex(r => r.key === key);
  const min = fr[key] || 0;
  const next = FLORIST_RANKS[i + 1];
  return { min, max: next ? Math.max(min, fr[next.key] || 0) : Math.max(min, maxPerMemberEst()) };
}

function emptyEstimate() {
  const counts = {};
  for (const r of FLORIST_RANKS) counts[r.key] = 0;
  return { totalPlayers: null, counts };
}

function estimateStats(est) {
  const fr = state.data.settings.floristRanks;
  let min = 0, max = 0, titled = 0;
  for (const r of FLORIST_RANKS) {
    const c = (est.counts || {})[r.key] || 0;
    const b = rankBounds(r.key);
    min += c * b.min;
    max += c * b.max;
    titled += c;
  }
  const total = est.totalPlayers ?? titled;
  const untitled = Math.max(0, total - titled);
  min += untitled * (fr.unknown || 0);
  max += untitled * (fr.unknown || 0);
  return {
    min, max, avg: Math.round((min + max) / 2), titled, untitled, total,
    knownPct: total ? Math.round(1000 * titled / total) / 10 : null,
  };
}

function predictionErr(score, avg) {
  if (score === null || score === undefined || score === '') return '—';
  const err = Math.round(score - avg);
  const pct = score ? Math.round(1000 * Math.abs(err) / score) / 10 : 0;
  return `${err >= 0 ? '+' : '−'}${fmtNum(Math.abs(err))} (${pct}%)`;
}

function rivalEstCard(r) {
  const est = r.estimate || emptyEstimate();
  const stats = estimateStats(est);
  const ranksDesc = [...FLORIST_RANKS].reverse();
  const num = (key, value, ph) => isAdmin()
    ? `<input type="number" inputmode="numeric" min="0" data-est="${key}" value="${value ?? ''}" placeholder="${ph}">`
    : `<strong>${fmtNum(value)}</strong>`;
  return `
    <div class="card estcard" data-estcard="${r.id}">
      <h3 class="estname" ${isAdmin() ? `data-editrival="${r.id}" title="Edit rival"` : ''}>${esc(r.name)}</h3>
      <div class="estrow"><span class="muted small">Total players</span>${num('totalPlayers', est.totalPlayers, '?')}</div>
      ${ranksDesc.map(rank => `
        <div class="estrow"><span class="tag tag-${rank.color}">${rank.label}</span>
          ${num(rank.key, (est.counts || {})[rank.key] || null, '0')}</div>`).join('')}
      <div class="estrow"><span class="tag tag-none">Untitled</span><strong data-out="untitled">${stats.untitled}</strong></div>
      <div class="estrow muted small"><span>Known titles</span><span data-out="knownPct">${stats.knownPct === null ? '—' : stats.knownPct + '%'}</span></div>
      <hr>
      <div class="estscores">
        <div><span class="muted small">Min</span><strong data-out="min">${fmtNum(stats.min)}</strong></div>
        <div><span class="muted small">Average</span><strong data-out="avg">${fmtNum(stats.avg)}</strong></div>
        <div><span class="muted small">Max</span><strong data-out="max">${fmtNum(stats.max)}</strong></div>
      </div>
      <hr>
      <div class="estrow"><span class="muted small">Actual comp score</span>${num('score', r.score, 'TBD')}</div>
      <div class="estrow"><span class="muted small">Prediction error</span><strong data-out="err">${predictionErr(r.score, stats.avg)}</strong></div>
    </div>`;
}

function readCardEstimate(card) {
  const val = key => {
    const el = card.querySelector(`[data-est="${key}"]`);
    return el && el.value !== '' ? Number(el.value) : null;
  };
  const counts = {};
  for (const r of FLORIST_RANKS) counts[r.key] = Math.max(0, Math.round(val(r.key) || 0));
  return { estimate: { totalPlayers: val('totalPlayers'), counts }, score: val('score') };
}

function refreshEstCard(card) {
  const { estimate, score } = readCardEstimate(card);
  const stats = estimateStats(estimate);
  const set = (key, text) => { card.querySelector(`[data-out="${key}"]`).textContent = text; };
  set('untitled', stats.untitled);
  set('knownPct', stats.knownPct === null ? '—' : stats.knownPct + '%');
  set('min', fmtNum(stats.min));
  set('avg', fmtNum(stats.avg));
  set('max', fmtNum(stats.max));
  set('err', predictionErr(score, stats.avg));
}

// persist quietly (no re-render) so tabbing between card inputs isn't interrupted
function persistEstimates(c) {
  const competitors = (c.competitors || []).map(r => {
    const card = document.querySelector(`[data-estcard="${r.id}"]`);
    return card ? { ...r, ...readCardEstimate(card) } : r;
  });
  try {
    store.updateCompetition(c.id, { competitors });
    persist();
  } catch (e) {
    toast(e.message || 'Save failed', true);
  }
}

function renderRivals() {
  const comps = [...state.data.competitions].sort((a, b) => cmp(b.weekStart, a.weekStart));
  if (!comps.some(x => x.id === ui.rivalsWeekId)) ui.rivalsWeekId = comps[0]?.id ?? null;
  const c = comps.find(x => x.id === ui.rivalsWeekId) || null;
  const rivals = c ? [...(c.competitors || [])].sort((a, b) => cmp(a.name, b.name)) : [];

  app().innerHTML = chrome(`
    <h1>Rivals</h1>
    <h2>Competitor history</h2>
    <div class="toolbar">
      <input type="search" id="rsearch" placeholder="Search guild name…" value="${esc(ui.search.rivals)}">
      <button class="btn secondary small" id="rtoggle" type="button">Show full list</button>
    </div>
    <div id="rivals-table"></div>
    ${comps.length ? `
      <h2>Score estimates</h2>
      <div class="toolbar">
        <select id="rweek">${comps.map(x =>
          `<option value="${x.id}" ${c && x.id === c.id ? 'selected' : ''}>${esc(weekLabel(x))}</option>`).join('')}</select>
        ${isAdmin() && c ? '<button class="btn small" id="estaddrival">+ Add rival</button>' : ''}
      </div>
      <p class="muted small">Fill each card from the florist titles that guild's players display
        in-game. Min uses each title's point floor, max lets every member reach the next title's
        floor; untitled players count at the assumed value. Floors and assumptions are editable
        in Settings. <span class="badge">est.</span></p>
      ${rivals.length
        ? `<div class="rivalcards">${rivals.map(rivalEstCard).join('')}</div>`
        : `<div class="empty"><div class="big">⚔️</div>No rivals in this week yet.${isAdmin() ? ' Add them with the button above.' : ''}</div>`}
      <p class="muted small">Our own max potential: <strong>${fmtNum(guildPotential().value)}</strong> — the number to push past theirs.</p>`
      : '<div class="empty"><div class="big">⚔️</div>Create a competition week first (Weeks tab), then estimate rivals here.</div>'}
  `, '#/rivals');
  bindChrome();
  renderRivalsTable();
  $('#rsearch').addEventListener('input', e => { ui.search.rivals = e.target.value; renderRivalsTable(); });
  $('#rtoggle').addEventListener('click', () => { ui.rivalsShowAll = !ui.rivalsShowAll; renderRivalsTable(); });
  $('#rweek')?.addEventListener('change', e => { ui.rivalsWeekId = e.target.value; renderRivals(); });
  $('#estaddrival')?.addEventListener('click', () => rivalFormDialog(c, null));
  document.querySelectorAll('[data-editrival]').forEach(el =>
    el.addEventListener('click', () => {
      const r = (c.competitors || []).find(x => x.id === el.dataset.editrival);
      if (r) rivalFormDialog(c, r);
    }));
  document.querySelectorAll('[data-estcard]').forEach(card => {
    card.querySelectorAll('[data-est]').forEach(inp => {
      inp.addEventListener('input', () => refreshEstCard(card));
      inp.addEventListener('change', () => persistEstimates(c));
    });
  });
}

// ------------------------------------------------------------- settings ---

function renderSettings() {
  const s = state.data.settings;
  const ro = isAdmin() ? '' : 'disabled';
  app().innerHTML = chrome(`
    <h1>Settings</h1>
    ${isAdmin() ? '' : '<p class="muted">You\'re in view-only mode. Tap “Edit mode” at the top to change settings.</p>'}
    <form id="sform">
      <div class="card">
        <h2 style="margin-top:0">Guild</h2>
        <label>Guild name</label>
        <input name="guildName" ${ro} value="${esc(s.guildName)}">
        <label>Member capacity (grows as the guild levels)</label>
        <input name="memberCapacity" ${ro} type="number" min="1" value="${s.memberCapacity}">
      </div>
      <div class="card">
        <h2 style="margin-top:0">Quest scoring rules</h2>
        <p class="muted small">Editable so the tool survives game rebalances.</p>
        <div class="formrow">
          <div><label>Quests per member — min</label><input name="questsMin" ${ro} type="number" value="${s.questsMin}"></div>
          <div><label>Quests per member — max</label><input name="questsMax" ${ro} type="number" value="${s.questsMax}"></div>
        </div>
        <label>Base quest scores (comma-separated)</label>
        <input name="baseQuestScores" ${ro} value="${s.baseQuestScores.join(', ')}">
        <div class="formrow3">
          <div><label>Max multiplier</label><input name="maxMultiplier" ${ro} type="number" step="any" value="${s.maxMultiplier}"></div>
          <div><label>Bonus min</label><input name="bonusMin" ${ro} type="number" value="${s.bonusMin}"></div>
          <div><label>Bonus max</label><input name="bonusMax" ${ro} type="number" value="${s.bonusMax}"></div>
        </div>
      </div>
      <div class="card">
        <h2 style="margin-top:0">Potential estimate <span class="badge">est.</span></h2>
        <p class="muted small">Member potential = max quests × ((that member's highest-point
          owned flower × max multiplier) + that member's bonus on that flower), unless a member
          has a manual override. Guild potential sums active members.</p>
        <div class="formrow">
          <div><label>Score per quest</label><input name="p_scorePerQuest" ${ro} type="number" step="any" value="${s.potential.scorePerQuest}"></div>
          <div><label>Avg bonus per quest</label><input name="p_avgBonus" ${ro} type="number" step="any" value="${s.potential.avgBonus}"></div>
        </div>
        <label class="inline" style="margin-bottom:10px">
          <input type="checkbox" name="p_includeBonus" ${ro} ${s.potential.includeBonus ? 'checked' : ''}>Include bonus in estimate
        </label>
        <label>Manual member count (blank = use roster)</label>
        <input name="p_membersOverride" ${ro} type="number" placeholder="auto" value="${s.potential.membersOverride ?? ''}">
        ${isAdmin() ? '<button class="btn secondary small" type="button" id="deriveddefaults">Reset to derived defaults</button>' : ''}
      </div>
      <div class="card">
        <h2 style="margin-top:0">Florist rank labels</h2>
        <p class="muted small">Minimum points behind each profile label — powers the
          <a href="#/rivals">Rivals score calculator</a>. Editable in case the game rebalances.</p>
        <div class="formrow">
          ${FLORIST_RANKS.map(r => `
            <div>
              <label><span class="tag tag-${r.color}">${r.label}</span></label>
              <input name="fr_${r.key}" ${ro} type="number" min="0" value="${s.floristRanks[r.key]}">
            </div>`).join('')}
          <div>
            <label><span class="tag tag-none">Untitled — assumed each</span></label>
            <input name="fr_unknown" ${ro} type="number" min="0" value="${s.floristRanks.unknown}">
          </div>
        </div>
      </div>
      ${isAdmin() ? '<button class="btn" style="width:100%">Save settings</button>' : ''}
    </form>
    <div class="card">
      <h2 style="margin-top:0">Data & sharing</h2>
      <p class="muted small">This app stores everything in <strong>this browser on this device only</strong> —
        there's no server, so data doesn't sync between people. To share or move it:
        one person keeps the master copy, <strong>exports</strong> the JSON, and the others
        <strong>import</strong> it. Export regularly as your backup.</p>
      <button class="btn secondary small" id="backup">Export data (JSON)</button>
      <button class="btn secondary small" id="importbtn">Import / restore JSON</button>
      <button class="btn small" id="exportall">Export full report (CSV)</button>
      <input type="file" id="importfile" accept="application/json,.json" hidden>
    </div>
  `, '#/settings');
  bindChrome();

  $('#backup').addEventListener('click', () =>
    downloadFile(`guild-backup-${localISO(new Date())}.json`, JSON.stringify(state.data, null, 2), 'application/json'));

  $('#importbtn').addEventListener('click', () => {
    if (!isAdmin()) { toast('Switch to Edit mode to import.', true); return; }
    $('#importfile').click();
  });
  $('#importfile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try { parsed = JSON.parse(reader.result); }
      catch { toast('That file isn\'t valid JSON.', true); return; }
      const looksRight = parsed && typeof parsed === 'object' &&
        (Array.isArray(parsed.members) || Array.isArray(parsed.flowers) || Array.isArray(parsed.competitions) || parsed.settings);
      if (!looksRight) { toast('That doesn\'t look like a Guild HQ backup.', true); return; }
      const counts = `${(parsed.members || []).length} members, ${(parsed.flowers || []).length} flowers, ${(parsed.competitions || []).length} weeks`;
      if (!confirm(`Replace ALL current data with this file (${counts})? This cannot be undone — export your current data first if unsure.`)) return;
      commit(() => store.replaceAll(parsed), 'Data imported');
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  $('#exportall').addEventListener('click', exportFullReport);

  $('#deriveddefaults')?.addEventListener('click', () => {
    const form = $('#sform');
    const scores = String(form.baseQuestScores.value).split(',').map(v => Number(v.trim())).filter(n => n > 0);
    const top = scores.length ? Math.max(...scores) : 30;
    form.p_scorePerQuest.value = top * (Number(form.maxMultiplier.value) || 2);
    form.p_avgBonus.value = ((Number(form.bonusMin.value) || 0) + (Number(form.bonusMax.value) || 0)) / 2;
    toast('Derived defaults filled — hit Save settings to apply');
  });

  if (isAdmin()) {
    $('#sform').addEventListener('submit', e => {
      e.preventDefault();
      const f = new FormData(e.target);
      commit(() => store.updateSettings({
        guildName: f.get('guildName'), memberCapacity: f.get('memberCapacity'),
        questsMin: f.get('questsMin'), questsMax: f.get('questsMax'),
        baseQuestScores: String(f.get('baseQuestScores')).split(',').map(v => Number(v.trim())),
        maxMultiplier: f.get('maxMultiplier'), bonusMin: f.get('bonusMin'), bonusMax: f.get('bonusMax'),
        potential: {
          scorePerQuest: f.get('p_scorePerQuest'), avgBonus: f.get('p_avgBonus'),
          includeBonus: f.get('p_includeBonus') === 'on', membersOverride: f.get('p_membersOverride') || null,
        },
        floristRanks: Object.fromEntries(
          [...FLORIST_RANKS.map(r => r.key), 'unknown'].map(k => [k, f.get(`fr_${k}`)])),
      }), 'Settings saved');
    });
  }
}

function exportFullReport() {
  const rows = [['Week', 'Member', 'Role', 'Quests', 'Score']];
  const comps = [...state.data.competitions].sort((a, b) => cmp(a.weekStart, b.weekStart));
  for (const c of comps) {
    for (const r of c.memberResults || []) {
      const m = memberById(r.memberId);
      rows.push([weekLabel(c), m ? m.name : '(removed)', m ? m.role : '', r.questsCompleted ?? '', r.finalScore ?? '']);
    }
  }
  if (rows.length === 1) { toast('No member results to export yet.', true); return; }
  downloadFile(`guild-full-report-${localISO(new Date())}.csv`, rows.map(r => r.map(csvCell).join(',')).join('\n'));
  toast('Full report exported');
}

// --------------------------------------------------------------- router ---

function render() {
  const hash = location.hash || '#/dashboard';
  const [, view, ...rest] = hash.split('/');
  const id = rest.join('/');
  window.scrollTo(0, 0);
  switch (view) {
    case 'members': id ? renderMemberDetail(id) : renderMembers(); break;
    case 'summary': renderSummary(); break;
    case 'flowers': renderFlowers(); break;
    case 'weeks': id ? renderWeekDetail(id) : renderWeeks(); break;
    case 'rivals': id ? renderRivalDetail(id) : renderRivals(); break;
    case 'settings': renderSettings(); break;
    default: renderDashboard();
  }
}

window.addEventListener('hashchange', render);

load();
render();
  </script>
